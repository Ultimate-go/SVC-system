    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // ★ 抢在首次绘制之前把主题定下来 —— 否则选浅色的用户会先看到一帧深色再跳过去（FOUC）。
      //   与 stores/theme.js 读的是同一批 key，改一处要改两处。
      try {
        var t = localStorage.getItem('vds_theme') || 'dark'
        var el = document.documentElement
        el.setAttribute('data-theme', t)
        if (t === 'dark') el.classList.add('dark')
        if (localStorage.getItem('vds_density') === 'compact') el.classList.add('compact')
        if (localStorage.getItem('vds_motion') === 'off') el.classList.add('no-motion')
      } catch (e) {
        /* 隐私模式下 localStorage 可能抛错 —— 保持上面的深色默认值即可。 */
      }
    </script>
